    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      /* Critical CSS for loading screen to prevent FOUC */
      body { margin: 0; background-color: #1e104e; }
      .loading-screen {
        position: fixed;
        inset: 0;
        background: #1e104e;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: white;
        font-family: 'Outfit', sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 300ms ease, visibility 300ms ease;
      }
      .loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #ff8566;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/web-story/assets/index-nUUhWBMA.js"></script>
    <link rel="stylesheet" crossorigin href="/web-story/assets/index-BjrVqxkp.css">
  </head>
